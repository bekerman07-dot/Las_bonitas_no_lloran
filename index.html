<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hola poto roto</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@200;300;400&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0d060a;
            font-family: 'Montserrat', sans-serif;
            color: #f7e8ed;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .container {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            pointer-events: none;
        }

        .title {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(2.8rem, 8vw, 5.5rem);
            font-weight: 400;
            letter-spacing: 2px;
            color: #fce8ef;
            text-shadow: 0 0 20px rgba(230, 80, 130, 0.4),
                         0 0 40px rgba(200, 50, 100, 0.2);
            margin-bottom: 25px;
            animation: fadeIn 2s ease-in-out forwards;
        }

        .hearts-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            animation: fadeIn 2.5s ease-in-out forwards;
        }

        .heart {
            color: #e84a75;
            display: inline-block;
            filter: drop-shadow(0 0 10px rgba(232, 74, 117, 0.6));
            animation: pulse 1.8s infinite ease-in-out;
        }

        .heart svg {
            width: clamp(28px, 5vw, 42px);
            height: clamp(28px, 5vw, 42px);
            fill: currentColor;
        }

        .heart:nth-child(1) { animation-delay: 0s; }
        .heart:nth-child(2) { animation-delay: 0.3s; transform: scale(1.25); color: #f46b95; }
        .heart:nth-child(3) { animation-delay: 0.6s; }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
                filter: drop-shadow(0 0 8px rgba(232, 74, 117, 0.5));
            }
            50% {
                transform: scale(1.22);
                filter: drop-shadow(0 0 18px rgba(244, 107, 149, 0.85));
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>

    <canvas id="canvas"></canvas>

    <div class="container">
        <h1 class="title">Hola poto roto</h1>
        
        <div class="hearts-wrapper">
            <div class="heart">
                <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
            </div>
            <div class="heart">
                <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
            </div>
            <div class="heart">
                <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        class FloatingHeart {
            constructor(x, y, isInteractive = false) {
                this.x = x || Math.random() * width;
                this.y = y || height + Math.random() * 20;
                this.size = Math.random() * 12 + 8;
                this.speedY = Math.random() * 0.8 + 0.4;
                this.speedX = (Math.random() - 0.5) * 0.5;
                this.opacity = Math.random() * 0.5 + 0.3;
                this.fadeSpeed = Math.random() * 0.003 + 0.001;
                this.color = Math.random() > 0.4 ? '#e84a75' : '#f46b95';
                this.isInteractive = isInteractive;

                if (isInteractive) {
                    this.speedY = Math.random() * 1.5 + 1;
                    this.speedX = (Math.random() - 0.5) * 2;
                    this.size = Math.random() * 16 + 10;
                    this.opacity = 0.8;
                }
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.globalAlpha = this.opacity;
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 10;
                ctx.shadowColor = this.color;

                ctx.beginPath();
                const d = this.size;
                ctx.moveTo(0, 0);
                ctx.bezierCurveTo(-d / 2, -d / 2, -d, d / 3, 0, d);
                ctx.bezierCurveTo(d, d / 3, d / 2, -d / 2, 0, 0);
                ctx.fill();
                ctx.restore();
            }

            update() {
                this.y -= this.speedY;
                this.x += this.speedX;
                this.opacity -= this.fadeSpeed;

                if (this.opacity <= 0 || this.y < -20) {
                    return false;
                }
                return true;
            }
        }

        const particles = [];
        const initCount = 35;

        for (let i = 0; i < initCount; i++) {
            const p = new FloatingHeart();
            p.y = Math.random() * height;
            particles.push(p);
        }

        function spawnHeart(e) {
            const x = e.clientX || (e.touches && e.touches[0].clientX);
            const y = e.clientY || (e.touches && e.touches[0].clientY);
            if (x && y) {
                for (let i = 0; i < 4; i++) {
                    particles.push(new FloatingHeart(x, y, true));
                }
            }
        }

        window.addEventListener('click', spawnHeart);
        window.addEventListener('touchstart', spawnHeart);

        function animate() {
            ctx.clearRect(0, 0, width, height);

            const gradient = ctx.createRadialGradient(width / 2, height / 2, 100, width / 2, height / 2, width);
            gradient.addColorStop(0, '#2b0818');
            gradient.addColorStop(1, '#0c050a');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, width, height);

            if (particles.length < 35 && Math.random() < 0.05) {
                particles.push(new FloatingHeart());
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.draw();
                if (!p.update()) {
                    particles.splice(i, 1);
                }
            }

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
